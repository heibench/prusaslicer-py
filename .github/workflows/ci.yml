name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked pull request is based on its parent branch, not
  # on main, and a base change fires `edited`, which is not a default activity
  # type -- so filtering on main means a retargeted PR gets no checks at all.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: just setup
      - run: just check

  # `.pre-commit-config.yaml` claims its hooks check this repository. They ran
  # only where someone had run `pre-commit install`, and `--no-verify` skipped
  # them there. Three of them also did nothing even when run -- see D11; they
  # now carry the flags that make them bite.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed by the `gitleaks-history` hook, which scans history. The
          # stock gitleaks hook is `--staged` and scans nothing on a CI
          # checkout, so without that hook this depth would buy nothing.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.11"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # PrusaSlicer is not installed on these runners, so the engine-dependent
      # tests skip. That is an environment fault, not a pass -- the skip count
      # in the log says how many tests were withheld. Do not set
      # PRUSASLICER_PY_REQUIRE_ENGINE here until a runner actually has the
      # engine; see docs/DECISIONS.md D3.
      - run: just setup
      - run: just test

  # `clean` is the one recipe with a per-OS body, and the Windows half is
  # PowerShell that cannot be exercised on a Linux machine. Asserting it works
  # from reading it is what #25 was about, so it runs here instead. Windows only:
  # the POSIX half is exercised by every other job that has a working tree.
  recipes:
    name: recipes (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: just setup
      - run: just clean
      - name: Assert clean actually removed the artifacts
        run: |
          $stale = '.venv','dist','.pytest_cache','.ruff_cache','.mypy_cache' |
            Where-Object { Test-Path $_ }
          if ($stale) { throw "just clean left: $stale" }
          $pyc = Get-ChildItem -Recurse -Directory -Filter __pycache__
          if ($pyc) { throw "just clean left __pycache__: $($pyc.FullName)" }
        shell: pwsh

  ok:
    name: ok
    if: always()
    needs: [check, test, pre-commit, recipes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `contains(needs.*.result, 'failure')` misses 'skipped', so an `if: false`
      # on `check` produced a fully green PR with nothing checked. Requiring
      # success names the only acceptable state instead of enumerating bad ones.
      - name: Fail unless every upstream job succeeded
        if: >-
          needs.check.result != 'success' ||
          needs.test.result != 'success' ||
          needs.pre-commit.result != 'success' ||
          needs.recipes.result != 'success'
        run: exit 1
      - name: Pass
        run: echo 'All checks passed'
