version: 2
updates:
  # The pins live in pyproject.toml's [dependency-groups] and uv.lock; there is
  # no requirements.txt left for the pip ecosystem to read.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
