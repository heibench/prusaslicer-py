[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prusaslicer-py"
version = "0.1.0"
description = "Python driver for the PrusaSlicer command-line interface"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Cameron Brooks" }]
keywords = ["prusaslicer", "slicer", "gcode", "3d-printing", "fff", "sla", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
        "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/heibench/prusaslicer-py"
Repository = "https://github.com/heibench/prusaslicer-py"
Issues = "https://github.com/heibench/prusaslicer-py/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["prusaslicer_py"]

# -- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: report the reason for every skip. A run that withholds the engine tests
# has to say so in the log, or the skip is indistinguishable from a pass.
addopts = ["-ra"]

# -- ruff ---------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# -- mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Without this mypy skips the BODY of any function with no annotations, so adding
# `scripts/` to the gate would have checked almost nothing: 12 of its 13 functions are
# unannotated. It found three real ones there and six in the tests on the first run.
check_untyped_defs = true
